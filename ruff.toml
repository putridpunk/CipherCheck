# Lint rules for CI (ruff). Kept small on purpose: real mistakes, not style opinions.
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", "release", ".venv"]

[lint]
select = ["E", "F", "W", "B"]

[lint.per-file-ignores]
# Translations contain long sentences.
"src/locales/*.py" = ["E501"]
# HTML/text templates.
"src/report.py" = ["E501"]
