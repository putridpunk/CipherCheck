name: Release

# Builds the executables on every OS. Push a tag like v0.3.0 to publish them
# on a GitHub Release; run it manually (workflow_dispatch) to only get artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (runs the tests first)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python build.py
          else
            python build.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ciphercheck-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" * --generate-notes --title "CipherCheck $TAG" --repo "$GITHUB_REPOSITORY"
          fi
