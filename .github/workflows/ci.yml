name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Unit tests (with a virtual display on Linux so the GUI smoke tests run)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -t . -v
          else
            python -m unittest discover -s tests -t . -v
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the tools
        run: python -m pip install ruff "mypy==1.13.0"
      - name: Ruff (rules in ruff.toml)
        run: ruff check .
      - name: Mypy (settings in mypy.ini)
        run: mypy

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Tk, a virtual display and coverage
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb
          python -m pip install coverage tkinterdnd2
      - name: Run the tests under coverage
        run: xvfb-run -a coverage run -m unittest discover -s tests -t .
      - name: Report (fails below 80%)
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=80

  package:
    name: Python package (wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
                    python -m pip wheel . --no-deps --wheel-dir wheel_out
          ls -l wheel_out
      - name: Install it in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install wheel_out/*.whl
          /tmp/clean/bin/ciphercheck --version
          /tmp/clean/bin/ciphercheck -p sunshine99 | grep -i "leaked passwords"
          /tmp/clean/bin/ciphercheck --passphrase
          /tmp/clean/bin/python -m ciphercheck --hash 5f4dcc3b5aa765d61d8327deb882cf99 | head -3
