[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphercheck"
dynamic = ["version"]
description = "Offline password security auditor with a Matrix-themed desktop app in 9 languages: entropy, pattern and dictionary detection, leak check, hash identification and reports."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "putridpunk" }]
keywords = ["password", "security", "entropy", "audit", "offline", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# No runtime dependencies: standard library only (the GUI needs Tk, which ships with most Python installs).

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4"]   # drag a file onto the Audit tab
dev = ["ruff", "mypy==1.13.0", "coverage", "pyinstaller"]

[project.scripts]
ciphercheck = "ciphercheck.main:main"

[project.gui-scripts]
ciphercheck-gui = "ciphercheck.gui:run"

[project.urls]
Homepage = "https://github.com/putridpunk/CipherCheck"
Changelog = "https://github.com/putridpunk/CipherCheck/blob/main/CHANGELOG.md"
Issues = "https://github.com/putridpunk/CipherCheck/issues"

[tool.setuptools]
# The repository folder is called src/; it is installed as the package "ciphercheck".
package-dir = { "ciphercheck" = "src" }
packages = ["ciphercheck", "ciphercheck.gui", "ciphercheck.locales"]

[tool.setuptools.package-data]
ciphercheck = ["data/*", "assets/*"]

[tool.setuptools.dynamic]
version = { attr = "ciphercheck.__version__" }
